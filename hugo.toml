baseURL = 'https://go-fft.github.io/'
locale  = 'en-us'
title   = 'go-fft'
# No theme -- the layout is the go-* family template go-authn.github.io uses:
# one self-contained layouts/index.html, partials/styles.html (inline :root
# tokens) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-fft is a pure-Go (CGO=0) FFT library — the numpy.fft / scipy.fft equivalent for Go, with no dependency on the native FFTW3 C library. Pure Go on the six 64-bit targets, with AVX2 and AVX-512 kernels on amd64, bit-identical to the Go code."

[[params.repos]]
  name  = "fft"
  kind  = "library"
  href  = "https://github.com/go-fft/fft"
  blurb = "The library. Complex &amp; real transforms of any length (<code>FFT</code>/<code>IFFT</code>/<code>RFFT</code>/<code>IRFFT</code>), N-D and 2-D (<code>FFTN</code>/<code>FFT2</code>), allocation-free plans (<code>NewPlan</code>, <code>NewPlanN</code>, <code>NewRealPlan2</code>), numpy's <code>n</code>/<code>norm</code>/<code>axes</code>, <code>HFFT</code>, <code>FFTShift</code>, the DCT and DST of types I–IV, single precision for all of it (<code>FFT32</code>, <code>FFTN32</code>, <code>DCT32</code>…, with its own SIMD kernels), frequency-bin helpers, windows, and spectral helpers (<code>PSD</code>/<code>Spectrogram</code>). A mixed-radix Stockham engine, Rader and Bluestein for the other lengths, <strong>AVX2 and AVX-512 pass kernels</strong> on amd64 and <strong>NEON</strong> on arm64, chosen at run time and bit-identical to the Go code."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-fft.github.io/docs/"
  blurb = "The documentation site (Hugo + hugo-theme-relearn): the API, the phased roadmap, and benchmarks against FFTW, numpy/scipy (pocketfft) and gonum. <a href=\"https://github.com/go-fft/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-fft/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The API cards (#api) and the count in the hero come from this list, never
# from a number typed beside it.
[[params.families]]
  name = "Complex 1-D"
  what = "`FFT`, `IFFT` and `Plan` for any length: Stockham for lengths whose prime factors are at most 13, Rader or Bluestein for the rest."
[[params.families]]
  name = "Real 1-D and Hermitian"
  what = "`RFFT`, `IRFFT`, `HFFT`, `IHFFT` and `RealPlan`: the N/2+1 non-redundant bins, as `numpy.fft.rfft` returns them."
[[params.families]]
  name = "N-D and 2-D"
  what = "`FFTN`, `FFT2`, `RFFTN`, `RFFT2` and allocation-free `PlanN`/`RealPlan2`, over a row-major shape, spread across cores when large."
[[params.families]]
  name = "numpy's arguments"
  what = "`n`, `norm` and `axes` through the `...With(Options)` variants, whose zero value is numpy's defaults; `FFTShift` and `NextFastLen`."
[[params.families]]
  name = "DCT and DST"
  what = "Types I–IV, forward, inverse and N-D, as `scipy.fft.dct` and `dst` define them, with reusable plans."
[[params.families]]
  name = "Single precision"
  what = "Every function above with `32` appended: `complex64` in, `complex64` out, as scipy.fft and NumPy 2 keep it, on its own AVX2 and NEON kernels."
[[params.families]]
  name = "Windows and spectra"
  what = "`Hann`, `Hamming`, `Blackman`, `BlackmanHarris`, `Bartlett`, `FFTFreq`, `RFFTFreq`, `PSD` and `Spectrogram`."

