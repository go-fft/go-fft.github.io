baseURL = 'https://go-fft.github.io/'
locale  = 'en-us'
title   = 'go-fft'
# No theme -- the layout is the go-* family template go-authn.github.io uses:
# one self-contained layouts/index.html, partials/styles.html (inline :root
# tokens) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-fft is a pure-Go (CGO=0) FFT library — the numpy.fft / scipy.fft equivalent for Go, with no dependency on the native FFTW3 C library. Pure Go on the six 64-bit targets, with AVX2 and AVX-512 kernels on amd64, bit-identical to the Go code."

# The colours are the only thing that differs from go-authn's page, and they
# are read here by partials/styles.html. Emerald, shared with go-ndarray: the
# two are one scientific-computing family, told apart by their glyphs. The
# logo's own gradient is #34D399 -> #047857.
[params.brand]
  base   = "#059669"   # emerald-600: accent, primary button, gradient start
  deep   = "#047857"   # emerald-700: gradient end
  bright = "#34d399"   # emerald-400: accent in dark mode
  shadow = "rgba(5,150,105,.7)"
  chipBg     = "#d1fae5"
  chipBorder = "#a7f3d0"
  chipFg     = "#047857"
  chipBgDark     = "rgba(52,211,153,.14)"
  chipBorderDark = "rgba(52,211,153,.32)"
  chipFgDark     = "#6ee7b7"
  glow        = "rgba(110,231,183,.22)"
  glow2       = "rgba(5,150,105,.10)"
  glyphShadow = "rgba(5,150,105,.6)"
  statsTint   = "#a7f3d0"
  bandFg      = "#d1fae5"
  # White on emerald-600 is 3.77:1, under the 4.5:1 body text needs; the band
  # paragraph and the primary button sit on this gradient, so it runs one step
  # darker than the accent: 700 -> 800 (white 5.48:1, #d1fae5 4.84:1 at worst).
  gradFrom    = "#047857"
  gradTo      = "#065f46"
  # The hero's accent words: emerald-400 -> 300 on the dark background (the
  # light theme keeps base -> deep, 600 -> 700).
  gradTextDark = "linear-gradient(135deg,#34d399,#6ee7b7)"
  [params.brand.surfaces]
    ink        = "#052e22"
    slate      = "#065f46"
    muted2     = "#047857"
    line       = "#a7f3d0"
    bg         = "#f0fdf9"
    bgSoft     = "#d1fae5"
    surface    = "#ffffff"
    navBg      = "rgba(240,253,249,.82)"
    navBorder  = "#a7f3d0"
    elevBorder = "#6ee7b7"
    ghostHover = "#6ee7b7"
    statsBg    = "#052e22"
  [params.brand.surfacesDark]
    ink        = "#d1fae5"
    slate      = "#a7f3d0"
    muted2     = "#6ee7b7"
    line       = "#0a3d2a"
    bg         = "#04130d"
    bgSoft     = "#052e22"
    surface    = "#06291c"
    navBg      = "rgba(4,19,13,.82)"
    navBorder  = "#0a3d2a"
    elevBorder = "#10593d"
    ghostHover = "#10593d"
    statsBg    = "#06291c"

# Each repo. Every field is rendered: "name" in the strip under the hero and on
# its card, "kind" as the card's tag, "href" as both links, "blurb" in full.
[[params.repos]]
  name  = "fft"
  kind  = "library"
  href  = "https://github.com/go-fft/fft"
  blurb = "The library. Complex &amp; real transforms of any length (<code>FFT</code>/<code>IFFT</code>/<code>RFFT</code>/<code>IRFFT</code>), N-D and 2-D (<code>FFTN</code>/<code>FFT2</code>), allocation-free plans (<code>NewPlan</code>, <code>NewPlanN</code>, <code>NewRealPlan2</code>), numpy's <code>n</code>/<code>norm</code>/<code>axes</code>, <code>HFFT</code>, <code>FFTShift</code>, the DCT and DST of types I–IV, single precision (<code>FFT32</code>), frequency-bin helpers, windows, and spectral helpers (<code>PSD</code>/<code>Spectrogram</code>). A mixed-radix Stockham engine, Rader and Bluestein for the other lengths, <strong>AVX2 and AVX-512 pass kernels</strong> on amd64 and <strong>NEON</strong> on arm64, chosen at run time and bit-identical to the Go code."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-fft.github.io/docs/"
  blurb = "The documentation site (Hugo + hugo-theme-relearn): the API, the phased roadmap, and benchmarks against FFTW, numpy/scipy (pocketfft) and gonum. <a href=\"https://github.com/go-fft/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-fft/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."
