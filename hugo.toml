baseURL = 'https://go-fft.github.io/'
locale  = 'en-us'
title   = 'go-fft'
# No theme -- the layout is the go-* family template go-authn.github.io uses:
# one self-contained layouts/index.html, partials/styles.html (inline :root
# tokens) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-fft is a pure-Go (CGO=0) FFT library — the numpy.fft / scipy.fft equivalent for Go, with no dependency on the native FFTW3 C library. Pure Go on the six 64-bit targets, with AVX2 and AVX-512 kernels on amd64, bit-identical to the Go code of their arithmetic (fused on amd64 with FMA3 by default since v0.32.0)."

[[params.repos]]
  name  = "fft"
  kind  = "library"
  href  = "https://github.com/go-fft/fft"
  blurb = "The library. Complex &amp; real transforms of any length (<code>FFT</code>/<code>IFFT</code>/<code>RFFT</code>/<code>IRFFT</code>), N-D and 2-D (<code>FFTN</code>/<code>FFT2</code>), allocation-free plans (<code>NewPlan</code>, <code>NewPlanN</code>, <code>NewRealPlan2</code>), numpy's <code>n</code>/<code>norm</code>/<code>axes</code>, <code>HFFT</code>, <code>FFTShift</code>, the DCT and DST of types I–IV, single precision for all of it (<code>FFT32</code>, <code>FFTN32</code>, <code>DCT32</code>…, with its own SIMD kernels), frequency-bin helpers, windows, and spectral helpers (<code>PSD</code>/<code>Spectrogram</code>). A mixed-radix Stockham engine, Rader and Bluestein for the other lengths, <strong>AVX2 and AVX-512 pass kernels</strong> on amd64 and <strong>NEON</strong> on arm64, chosen at run time and bit-identical to the Go code of their arithmetic (fused on amd64 with FMA3 by default since v0.32.0)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-fft.github.io/docs/"
  blurb = "The documentation site (Hugo + hugo-theme-relearn): the API, the phased roadmap, and benchmarks against FFTW, numpy/scipy (pocketfft) and gonum. <a href=\"https://github.com/go-fft/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-fft/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The API cards (#api) and the count in the hero come from this list, never
# from a number typed beside it.
[[params.families]]
  name = "Complex 1-D"
  what = "`FFT`, `IFFT` and `Plan` for any length: Stockham for lengths whose prime factors are at most 13, Rader or Bluestein for the rest."
[[params.families]]
  name = "Real 1-D and Hermitian"
  what = "`RFFT`, `IRFFT`, `HFFT`, `IHFFT` and `RealPlan`: the N/2+1 non-redundant bins, as `numpy.fft.rfft` returns them. Since v0.31.0 `FFTReal` (the full spectrum) runs on the real transform for even lengths, 2,320 to 1,587 ns at 1,024 points on a Zen 4 (go-fft#147), and `FFTRealWith` takes `n`, `norm`, `FMA` and `Exact`. Since v0.31.1 `RealPlan.FFTReal(dst, src)` is allocation-free and its conjugate mirror is a SIMD kernel: on a Zen 4, against FFTW's r2c plus mirror, 146 ns at 256 points (0.90 times FFTW's time), 608 at 1,024 (0.91) and 3,605 at 4,096 (1.11) (go-fft#153). Odd lengths need no separate algorithm: `RFFT` is 0.65 to 0.90 times FFTW r2c's time at 1,009, 1,125, 2,187 and 3,125 points (go-fft#116)."
[[params.families]]
  name = "N-D and 2-D"
  what = "`FFTN`, `FFT2`, `RFFTN`, `RFFT2` and allocation-free `PlanN`/`RealPlan2`, over a row-major shape, spread across cores when large."
[[params.families]]
  name = "numpy's arguments"
  what = "`n`, `norm` and `axes` through the `...With(Options)` variants, whose zero value is numpy's defaults; `FFTShift` and `NextFastLen`."
[[params.families]]
  name = "Fused multiply-add by default"
  what = "New in v0.35.0 (go-fft#164): on amd64 with AVX2+FMA, DCTPair and DCTMixedPair run a fused AVX2 kernel at 64 points (Zen 4, two transforms: 122.5 to 58.5 ns against FFTW REDFT11's 180.9, and 122.5 to 68.3 against 178.8 in float32; single DCT 64 unchanged at 59.5; on amd64 the pair is bit-different from two single calls, within the same bound). New in v0.35.1 (go-fft#163, design go-fft#162): the Zen 4 complex 256 kernel rewrites subtractions as FMAs by -1, same bits: kernel 135.5 to 127.9 ns, Plan.FFT 256 146.1 to 136.9 against FFTW AVX-512's 136.5 (1.003x). New in v0.43.0 (go-fft#175, a MINOR release, on go-simd/floats#69, now required at v0.28.0): the DCT-III inverse runs its reversed-gather complex multiply through floats.CMulZipRev (AVX2+FMA on amd64, portable loop elsewhere), replacing the scalar step; the DCT-III bits change, within the bound; Zen 4, v0.42.0 to v0.43.0, ratio to FFTW 3.3.10 AVX-512: DCT-III 32 72.1 to 69.7 ns (1.60x), 64 111.2 to 97.9 (1.15x), 128 192.9 to 159.7 (0.89x). New in v0.42.0 (go-fft#174, a MINOR release, on go-simd/floats#68): DCT-II and DCT-III at 32, 64 and 128 points use a fused route (the gather goes straight into the half-length FFT, then one vectorised post pass, floats.MirrorCombine / MirrorCombineSplit); ratio to FFTW 3.3.10 AVX-512 on a Zen 4, v0.41.0 to v0.42.0: DCT-II 32 1.57 to 1.35, 64 1.25 to 1.03, 128 1.03 to 0.79; DCT-III 32 1.82 to 1.67, 64 1.40 to 1.32, 128 1.12 to 1.07, still above 1.05 because a scalar reversed-gather complex multiply remains. New in v0.41.0 (go-fft#172, a MINOR release): complex64 reaches the fused kernel through one inlined function per length and Plan32.FFT goes straight to execute (Zen 4 and Cascade Lake), and the 2,048 kernel is 32×64, 8% faster than 64×32 on a Zen 4 and 11% on Cascade Lake; against FFTW single precision on a Zen 4: 64 at 1.01 to 1.04, 128 at 1.02, 256 at 0.98 to 1.01, 2,048 at 0.94 to 0.99, so no complex64 length from 64 to 8,192 is above 1.05. New in v0.40.0 (go-fft#171, a MINOR release; baseline in go-fft#162): fused complex64 (float32) kernels for 64 to 8,192 points on a Zen 4 and on Cascade Lake steppings 5 to 7, Default and FMA plans (Exact and NoFMA keep the old path): 0.47 to 0.72 of v0.39.0's time on a Zen 4, 0.43 to 0.66 on Cascade Lake, and 0.72 to 1.28 times FFTW's single-precision AVX-512 build, with 64, 128, 256 and 2,048 still above 1.05 at v0.40.0 (none is since v0.41.0); twiddles correctly rounded once to float32, tables aligned lazily so a complex128-only program does not carry them. New in v0.39.1 (go-fft#170): the odd-length inverse real transform (RealPlan.IRFFT, odd n) uses the plan's pooled buffer instead of two n-length allocations per call, same bits, zero allocations: on a Zen 4 c2r 1,125 takes 4,212 to 2,669 ns (FFTW 2,361; 1.78x to 1.13x), c2r 3,375 13,806 to 8,826, c2r 125 489 to 236. New in v0.39.0 (go-fft#169, a MINOR release; kernels in go-fft#162): the fused complex128 kernels for 256 and 2,048 also run on Intel Cascade Lake (CPUID model 0x55, steppings 5 to 7 only; Default and FMA plans), measured on cfarm151, a Cascade Lake KVM guest: 256 takes 0.82 of its old time (1.00x to 0.82x FFTW), 2,048 0.79 (1.11x to 0.87x); 1,024 is below the 5 percent bar and stays Zen 4 only; other models and steppings, Cooper Lake and Skylake-SP included, keep their plans. New in v0.38.0 (go-fft#168, a MINOR release): a fused 32×64 AVX-512 kernel for complex 2,048 on a Zen 4 (Default and FMA plans only; RFFT 4,096 through its half-length plan; twiddle tables aligned in place, no heap allocation): forward 2,272 to 1,875 ns (FFTW AVX-512 1,869), inverse 2,286 to 1,872 (FFTW 1,864), RFFT 4,096 2,789 to 2,502 (FFTW 2,493); 2,048 goes from 1.22x to 1.00x FFTW's time and RFFT 4,096 from 1.12x to 1.00x (the RFFT 4,096 gap tracked in go-fft#122). New in v0.37.1 (go-fft#167): the fused kernels' twiddle tables are 64-byte aligned (Go's linker aligns data to 32 bytes, so every zmm load split two cache lines; copies built at init, same bits): complex 1,024 Plan.FFT 823.9 to 786.6 ns on a Zen 4 against FFTW AVX-512's 753.4, 1.09x (v0.37.0) to 1.04x, complex 256 unchanged; a two-level twiddle table was tried and rejected (+8.3%, go-fft#162). New in v0.37.0 (go-fft#166, a MINOR release): a fused two-pass 32×32 AVX-512 kernel for complex 1,024 on a Zen 4 (Default and FMA plans only; PlanN rows of 1,024 too): forward 886.1 to 816.4 ns (FFTW AVX-512 749.8), inverse 885.5 to 820.4 (FFTW 750.8), 1.18x down to 1.09x FFTW's time; v0.35.2 ran fewer instructions than FFTW (9,560 against 12,644) at IPC 1.87 against 3.29 because of blocked stores (go-fft#162), and fusing removes half the stores. New in v0.36.0 (go-fft#158, a MINOR release): on arm64 the DCT-IV of 128 points runs a fused kernel, with pair forms at 128, for direct DCTPlan of 128 callers. An MDCT of N samples runs a DCT-IV of N/2: the MDCT and IMDCT at N=128 samples now run the fused DCT-IV of 64 (new for the MDCT path), and N=256 samples, whose DCT-IV is 128, keeps the old path by default (3 to 18 percent slower fused on a Neoverse-N1). Neoverse-N1, one core, against v0.35.2: DCT 128 -12.9%, Mixed -2.4%, pair -51.5%, Mixed pair -42.6%, MDCT/IMDCT at 128 samples -5 to -12%, direct DCT 64 unchanged; the bits of the DCT-IV of 128 change on arm64, within the bound. New in v0.35.2 (go-fft#165): the fused-256 test moved into Plan.execute so the kernel's wrapper inlines, same bits: Plan.FFT 256 136.8 to 134.1 ns against FFTW AVX-512's 137.2, 0.977x, faster than FFTW's best build. New in v0.34.0: every normalized inverse and Norm path scales with go-simd/floats Scale (Zen 4: Plan.IFFT 256 297.6 to 184.3 ns, PlanN.IFFT 64² 7,768 to 5,994, RealPlan.RFFTNorm 256 193.9 to 141.0, IFFTWith 256 545.6 to 435.6, go-fft#161; default plans change bits on signed zeros and infinities, Options.Exact keeps the old bits), and a fused two-pass AVX-512 kernel makes complex 256 on a Zen 4 155.6 to 143.7 ns (FFTW 133.4) and 256² 152.9 to 145.4 µs, at parity with FFTW's 145.9 (go-fft#160). Since v0.32.0 the default arithmetic fuses multiply-adds on amd64 with FMA3, as accurate as the unfused one: on a Zen 4 every float64 row is 0.925 to 1.012 of the unfused time (median about 0.985, complex 1,024 runs 32·32 and, since v0.32.1, complex 1,024 and 2,048 run on the 512-bit split layout: 0.946 and 0.878 of v0.32.0's time, about 1.16 and 1.17 times FFTW's AVX-512 build at v0.32.1, go-fft#156, 2,048 is 1.00 times since v0.38.0; 1,024 is 1.04 times since v0.37.1, 1.09 at v0.37.0), on a Cascade Lake guest the 1-D complex rows gain up to 0.80 (go-fft#155). `Options{NoFMA: true}` turns the fusing off, `Options{FMA: true}` asks for it explicitly, `Options{Exact: true}` is the reference arithmetic; `FMA` excludes `NoFMA` and `Exact` (both set panics). The contract is an error bound against an extended-precision oracle, at most `c·ε·log2(n)` with `c` from 0.5 to 2.25 (measured, not proved); `Options{Exact: true}` (v0.29.0) names the reference arithmetic as compiled by gc (v0.28.16's bits on the same machine), for callers who need the bits reproducible on one machine whatever the default becomes."
[[params.families]]
  name = "DCT and DST"
  what = "Types I–IV, forward, inverse and N-D, as `scipy.fft.dct` and `dst` define them, with reusable plans."
[[params.families]]
  name = "MDCT and IMDCT"
  what = "New in v0.29.0: the lapped transform of AAC, Vorbis and Opus:`NewMDCTPlan(n)` maps `n` samples (even) to `n/2` coefficients and back, float64 and float32, allocation-free, with `SineWindow` and `KBDWindow`; checked against the O(n²) definition in double-double. v0.29.1 fused the fold and unfold into the DCT-IV (128 samples: 143 to 96 ns, FFTW's REDFT11 plus the fold 87). v0.30.2 adds fold and unfold kernels for the MDCT (512 to 4,096 samples) and IMDCT (256 to 4,096): 0.91 to 0.97 times v0.30.1's time inside that window on an M4 Max, unchanged outside. v0.30.1 runs the DCT-IV, DST-IV, MDCT and Mixed twiddle passes on go-simd/floats v0.18.0 kernels (NEON, AVX2+FMA; go-fft's first dependency): DCT-IV at 64, 128, 256 and 1,024 points takes 88, 142, 273 and 1,038 ns against FFTW's 79, 143, 321 and 1,442, and the MDCT at 128 samples 87 ns, level with FFTW (M4 Max, one core); `Options.Exact` does not cover the DCT, DST and MDCT. New in v0.33.0 (go-fft#157): a fused DCT-IV of 64 points on arm64 for `DCT`, `IDCT`, `DCTMixed` and `IDCTMixed` (88 to 43.7 ns for float64 `DCT` 64, 81.5 to 52.6 for `DCTMixed`, M4 Max, one core), and `DCTPlan.DCTPair`, `IDCTPair`, `DCTMixedPair` and `IDCTMixedPair`, two transforms in one NEON kernel (2 × `DCT` 175 to 60.6 ns, 2 × `DCTMixed` 166 to 71.3), within the same error bound as `DCT` and not bit-identical to two float64 calls; other architectures are unchanged. New in v0.30.0: `MDCTMixed`, `IMDCTMixed`, `DCTMixed` and `IDCTMixed` take float32 data and compute in float64, for float32 storage with float64 accuracy (error at most c64·ε64·log2 n + ε32/2, with c64 = 1.75 (MDCT) and 2.0 (DCT-IV); 29 to 38 percent faster than float64 with manual conversions, 0.95 to 1.17 times the float32 plan's time)."
[[params.families]]
  name = "Single precision"
  what = "Every function above with `32` appended: `complex64` in, `complex64` out, as scipy.fft and NumPy 2 keep it, on its own AVX2 and NEON kernels."
[[params.families]]
  name = "Windows and spectra"
  what = "`Hann`, `Hamming`, `Blackman`, `BlackmanHarris`, `Bartlett`, `FFTFreq`, `RFFTFreq`, `PSD` and `Spectrogram`. Since v0.30.2 the Spectrogram window multiply and power pass run SIMD kernels (go-simd/floats `Mul` and `SquaredMagnitude`): 16,384 samples, segment 256, overlap 128, one core, 28.0 µs on a Zen 4 from 38.8 against FFTW's 25.4, and 40.8 µs on an M4 from 51.4."

[params.brand]
