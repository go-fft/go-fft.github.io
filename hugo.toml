baseURL = 'https://go-fft.github.io/'
locale  = 'en-us'
title   = 'go-fft'
# No theme -- the layout is the go-* family template go-authn.github.io uses:
# one self-contained layouts/index.html, partials/styles.html (inline :root
# tokens) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-fft is a pure-Go (CGO=0) FFT library — the numpy.fft / scipy.fft equivalent for Go, with no dependency on the native FFTW3 C library. Pure Go on the six 64-bit targets, with AVX2 and AVX-512 kernels on amd64, bit-identical to the Go code of their arithmetic (fused on amd64 with FMA3 by default since v0.32.0)."

[[params.repos]]
  name  = "fft"
  kind  = "library"
  href  = "https://github.com/go-fft/fft"
  blurb = "The library. Complex &amp; real transforms of any length (<code>FFT</code>/<code>IFFT</code>/<code>RFFT</code>/<code>IRFFT</code>), N-D and 2-D (<code>FFTN</code>/<code>FFT2</code>), allocation-free plans (<code>NewPlan</code>, <code>NewPlanN</code>, <code>NewRealPlan2</code>), numpy's <code>n</code>/<code>norm</code>/<code>axes</code>, <code>HFFT</code>, <code>FFTShift</code>, the DCT and DST of types I–IV, single precision for all of it (<code>FFT32</code>, <code>FFTN32</code>, <code>DCT32</code>…, with its own SIMD kernels), frequency-bin helpers, windows, and spectral helpers (<code>PSD</code>/<code>Spectrogram</code>). A mixed-radix Stockham engine, Rader and Bluestein for the other lengths, <strong>AVX2 and AVX-512 pass kernels</strong> on amd64 and <strong>NEON</strong> on arm64, chosen at run time and bit-identical to the Go code of their arithmetic (fused on amd64 with FMA3 by default since v0.32.0)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-fft.github.io/docs/"
  blurb = "The documentation site (Hugo + hugo-theme-relearn): the API, the phased roadmap, and benchmarks against FFTW, numpy/scipy (pocketfft) and gonum. <a href=\"https://github.com/go-fft/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-fft/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The API cards (#api) and the count in the hero come from this list, never
# from a number typed beside it.
[[params.families]]
  name = "Complex 1-D"
  what = "`FFT`, `IFFT` and `Plan` for any length: Stockham for lengths whose prime factors are at most 13, Rader or Bluestein for the rest."
[[params.families]]
  name = "Real 1-D and Hermitian"
  what = "`RFFT`, `IRFFT`, `HFFT`, `IHFFT` and `RealPlan`: the N/2+1 non-redundant bins, as `numpy.fft.rfft` returns them. Since v0.31.0 `FFTReal` (the full spectrum) runs on the real transform for even lengths, 2,320 to 1,587 ns at 1,024 points on a Zen 4 (go-fft#147), and `FFTRealWith` takes `n`, `norm`, `FMA` and `Exact`. Since v0.31.1 `RealPlan.FFTReal(dst, src)` is allocation-free and its conjugate mirror is a SIMD kernel: on a Zen 4, against FFTW's r2c plus mirror, 146 ns at 256 points (0.90 times FFTW's time), 608 at 1,024 (0.91) and 3,605 at 4,096 (1.11) (go-fft#153). Odd lengths need no separate algorithm: `RFFT` is 0.65 to 0.90 times FFTW r2c's time at 1,009, 1,125, 2,187 and 3,125 points (go-fft#116)."
[[params.families]]
  name = "N-D and 2-D"
  what = "`FFTN`, `FFT2`, `RFFTN`, `RFFT2` and allocation-free `PlanN`/`RealPlan2`, over a row-major shape, spread across cores when large."
[[params.families]]
  name = "numpy's arguments"
  what = "`n`, `norm` and `axes` through the `...With(Options)` variants, whose zero value is numpy's defaults; `FFTShift` and `NextFastLen`."
[[params.families]]
  name = "Fused multiply-add by default"
  what = "New in v0.35.0 (go-fft#164): on amd64 with AVX2+FMA, DCTPair and DCTMixedPair run a fused AVX2 kernel at 64 points (Zen 4, two transforms: 122.5 to 58.5 ns against FFTW REDFT11's 180.9, and 122.5 to 68.3 against 178.8 in float32; single DCT 64 unchanged at 59.5; on amd64 the pair is bit-different from two single calls, within the same bound). New in v0.35.1 (go-fft#163, design go-fft#162): the Zen 4 complex 256 kernel rewrites subtractions as FMAs by -1, same bits: kernel 135.5 to 127.9 ns, Plan.FFT 256 146.1 to 136.9 against FFTW AVX-512's 136.5 (1.003x). New in v0.34.0: every normalized inverse and Norm path scales with go-simd/floats Scale (Zen 4: Plan.IFFT 256 297.6 to 184.3 ns, PlanN.IFFT 64² 7,768 to 5,994, RealPlan.RFFTNorm 256 193.9 to 141.0, IFFTWith 256 545.6 to 435.6, go-fft#161; default plans change bits on signed zeros and infinities, Options.Exact keeps the old bits), and a fused two-pass AVX-512 kernel makes complex 256 on a Zen 4 155.6 to 143.7 ns (FFTW 133.4) and 256² 152.9 to 145.4 µs, at parity with FFTW's 145.9 (go-fft#160). Since v0.32.0 the default arithmetic fuses multiply-adds on amd64 with FMA3, as accurate as the unfused one: on a Zen 4 every float64 row is 0.925 to 1.012 of the unfused time (median about 0.985, complex 1,024 runs 32·32 and, since v0.32.1, complex 1,024 and 2,048 run on the 512-bit split layout: 0.946 and 0.878 of v0.32.0's time, about 1.16 and 1.17 times FFTW's AVX-512 build, go-fft#156), on a Cascade Lake guest the 1-D complex rows gain up to 0.80 (go-fft#155). `Options{NoFMA: true}` turns the fusing off, `Options{FMA: true}` asks for it explicitly, `Options{Exact: true}` is the reference arithmetic; `FMA` excludes `NoFMA` and `Exact` (both set panics). The contract is an error bound against an extended-precision oracle, at most `c·ε·log2(n)` with `c` from 0.5 to 2.25 (measured, not proved); `Options{Exact: true}` (v0.29.0) names the reference arithmetic as compiled by gc (v0.28.16's bits on the same machine), for callers who need the bits reproducible on one machine whatever the default becomes."
[[params.families]]
  name = "DCT and DST"
  what = "Types I–IV, forward, inverse and N-D, as `scipy.fft.dct` and `dst` define them, with reusable plans."
[[params.families]]
  name = "MDCT and IMDCT"
  what = "New in v0.29.0: the lapped transform of AAC, Vorbis and Opus:`NewMDCTPlan(n)` maps `n` samples (even) to `n/2` coefficients and back, float64 and float32, allocation-free, with `SineWindow` and `KBDWindow`; checked against the O(n²) definition in double-double. v0.29.1 fused the fold and unfold into the DCT-IV (128 samples: 143 to 96 ns, FFTW's REDFT11 plus the fold 87). v0.30.2 adds fold and unfold kernels for the MDCT (512 to 4,096 samples) and IMDCT (256 to 4,096): 0.91 to 0.97 times v0.30.1's time inside that window on an M4 Max, unchanged outside. v0.30.1 runs the DCT-IV, DST-IV, MDCT and Mixed twiddle passes on go-simd/floats v0.18.0 kernels (NEON, AVX2+FMA; go-fft's first dependency): DCT-IV at 64, 128, 256 and 1,024 points takes 88, 142, 273 and 1,038 ns against FFTW's 79, 143, 321 and 1,442, and the MDCT at 128 samples 87 ns, level with FFTW (M4 Max, one core); `Options.Exact` does not cover the DCT, DST and MDCT. New in v0.33.0 (go-fft#157): a fused DCT-IV of 64 points on arm64 for `DCT`, `IDCT`, `DCTMixed` and `IDCTMixed` (88 to 43.7 ns for float64 `DCT` 64, 81.5 to 52.6 for `DCTMixed`, M4 Max, one core), and `DCTPlan.DCTPair`, `IDCTPair`, `DCTMixedPair` and `IDCTMixedPair`, two transforms in one NEON kernel (2 × `DCT` 175 to 60.6 ns, 2 × `DCTMixed` 166 to 71.3), within the same error bound as `DCT` and not bit-identical to two float64 calls; other architectures are unchanged. New in v0.30.0: `MDCTMixed`, `IMDCTMixed`, `DCTMixed` and `IDCTMixed` take float32 data and compute in float64, for float32 storage with float64 accuracy (error at most c64·ε64·log2 n + ε32/2, with c64 = 1.75 (MDCT) and 2.0 (DCT-IV); 29 to 38 percent faster than float64 with manual conversions, 0.95 to 1.17 times the float32 plan's time)."
[[params.families]]
  name = "Single precision"
  what = "Every function above with `32` appended: `complex64` in, `complex64` out, as scipy.fft and NumPy 2 keep it, on its own AVX2 and NEON kernels."
[[params.families]]
  name = "Windows and spectra"
  what = "`Hann`, `Hamming`, `Blackman`, `BlackmanHarris`, `Bartlett`, `FFTFreq`, `RFFTFreq`, `PSD` and `Spectrogram`. Since v0.30.2 the Spectrogram window multiply and power pass run SIMD kernels (go-simd/floats `Mul` and `SquaredMagnitude`): 16,384 samples, segment 256, overlap 128, one core, 28.0 µs on a Zen 4 from 38.8 against FFTW's 25.4, and 40.8 µs on an M4 from 51.4."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.48:1, bright on the dark background 10.05:1.
  base = "#047857"
  deep = "#024935"
  bright = "#34d399"
  shadow = "rgba(4,120,87,.7)"
  glow = "rgba(4,120,87,.6)"
  wash = "rgba(4,120,87,.10)"
  washDeep = "rgba(2,73,53,.06)"
  chipBg = "#e7faf3"
  chipBorder = "#c2f2e0"
  chipFg = "#024935"
  chipBgDark = "rgba(52,211,153,.14)"
  chipBorderDark = "rgba(52,211,153,.32)"
  chipFgDark = "#8fe7c7"
  statsEnd = "#cef4e7"
  bandText = "#dff8ef"
